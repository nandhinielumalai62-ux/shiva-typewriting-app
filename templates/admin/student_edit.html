{% extends "base.html" %}
{% block title %}Edit Admission {{ student.student_code }} — {{ institute_name }}{% endblock %}

{% block content %}
<div class="container" style="max-width: 960px;">
  <div class="bold-card">
    <div class="bold-card-header d-flex justify-content-between align-items-center">
      <span><i class="bi bi-pencil-square me-2"></i> Edit Admission Details — {{ student.student_code }}</span>
      <a href="{{ url_for('admin_student_detail', student_id=student.id) }}" class="btn btn-sm btn-light fw-bold">Back</a>
    </div>
    <div class="card-body p-4">
      <form method="POST" enctype="multipart/form-data">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label fw-bold">Full Name *</label>
            <input type="text" name="full_name" class="form-control border-2" required value="{{ student.full_name }}">
          </div>
          <div class="col-md-3">
            <label class="form-label fw-bold">Gender</label>
            <select name="gender" class="form-select border-2">
              {% for g in ['Female', 'Male', 'Other'] %}
                <option value="{{ g }}" {% if student.gender == g %}selected{% endif %}>{{ g }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label fw-bold">DOB *</label>
            <input type="date" name="dob" class="form-control border-2" required value="{{ student.dob }}">
          </div>

          <div class="col-md-6">
            <label class="form-label fw-bold">Father / Guardian Name *</label>
            <input type="text" name="father_guardian_name" class="form-control border-2" required value="{{ student.father_guardian_name }}">
          </div>
          <div class="col-md-6">
            <label class="form-label fw-bold">Occupation</label>
            <input type="text" name="guardian_occupation" class="form-control border-2" value="{{ student.guardian_occupation }}">
          </div>

          <div class="col-md-4">
            <label class="form-label fw-bold">Qualification *</label>
            <input type="text" name="qualification" class="form-control border-2" required value="{{ student.qualification }}">
          </div>
          <div class="col-md-4">
            <label class="form-label fw-bold">School / College</label>
            <input type="text" name="school_college" class="form-control border-2" value="{{ student.school_college }}">
          </div>
          <div class="col-md-4">
            <label class="form-label fw-bold">Aadhaar / ID No.</label>
            <input type="text" name="aadhaar_no" class="form-control border-2" value="{{ student.aadhaar_no }}">
          </div>

          <div class="col-md-4">
            <label class="form-label fw-bold">Phone *</label>
            <input type="text" name="phone" class="form-control border-2" required value="{{ student.phone }}">
          </div>
          <div class="col-md-4">
            <label class="form-label fw-bold">Alternate Phone</label>
            <input type="text" name="alt_phone" class="form-control border-2" value="{{ student.alt_phone }}">
          </div>
          <div class="col-md-4">
            <label class="form-label fw-bold">Email</label>
            <input type="email" name="email" class="form-control border-2" value="{{ student.email }}">
          </div>

          <div class="col-md-6">
            <label class="form-label fw-bold">Address *</label>
            <textarea name="address" class="form-control border-2" rows="2" required>{{ student.address }}</textarea>
          </div>
          <div class="col-md-3">
            <label class="form-label fw-bold">City</label>
            <input type="text" name="city" class="form-control border-2" value="{{ student.city }}">
          </div>
          <div class="col-md-3">
            <label class="form-label fw-bold">Pincode</label>
            <input type="text" name="pincode" class="form-control border-2" value="{{ student.pincode }}">
          </div>

          <div class="col-md-4">
            <label class="form-label fw-bold">Course Category *</label>
            <select name="course_category" class="form-select border-2" required>
              {% for cat in course_categories %}
                <option value="{{ cat }}" {% if student.course_category == cat %}selected{% endif %}>{{ cat }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label fw-bold">Class Timing (7:00 AM to 7:00 PM) *</label>
            <select name="batch_timing" class="form-select border-2 fw-bold" required>
              {% for b in batch_timings %}
                <option value="{{ b }}" {% if student.batch_timing == b %}selected{% endif %}>{{ b }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="col-md-2">
            <label class="form-label fw-bold">Machine No.</label>
            <input type="text" name="machine_no" class="form-control border-2" value="{{ student.machine_no }}">
          </div>
          <div class="col-md-2">
            <label class="form-label fw-bold">Status</label>
            <select name="status" class="form-select border-2">
              <option value="Active" {% if student.status == 'Active' %}selected{% endif %}>Active</option>
              <option value="Inactive" {% if student.status == 'Inactive' %}selected{% endif %}>Inactive</option>
            </select>
          </div>

          <div class="col-md-3">
            <label class="form-label fw-bold">Admission Date</label>
            <input type="date" name="admission_date" class="form-control border-2" value="{{ student.admission_date }}">
          </div>
          <div class="col-md-3">
            <label class="form-label fw-bold">Admission Fee (Rs.)</label>
            <input type="number" step="0.01" name="admission_fee" class="form-control border-2" value="{{ student.admission_fee }}">
          </div>
          <div class="col-md-3">
            <label class="form-label fw-bold">Monthly Fee (Rs.)</label>
            <input type="number" step="0.01" name="monthly_fee" class="form-control border-2" value="{{ student.monthly_fee }}">
          </div>
          <div class="col-md-3">
            <label class="form-label fw-bold">Due Day (1-28)</label>
            <input type="number" min="1" max="28" name="fee_due_day" class="form-control border-2" value="{{ student.fee_due_day }}">
          </div>

          <div class="col-md-4">
            <label class="form-label fw-bold">Update Photo (File or Live Camera)</label>
            <div class="photo-preview-box mb-2" id="photoPreviewBox" style="width: 90px; height: 105px;">
              {% if student.photo_filename %}
                <img src="{{ url_for('static', filename='uploads/photos/' + student.photo_filename) }}" alt="Student Photo">
              {% else %}
                <span class="text-muted small text-center">No Photo</span>
              {% endif %}
            </div>
            <input type="hidden" name="captured_photo_data" id="capturedPhotoData">
            <input type="file" name="photo" id="photoFileInput" accept="image/*" class="form-control border-2 mb-1" onchange="previewAdmissionPhoto(this)">
            <button type="button" class="btn btn-dark btn-sm fw-bold" onclick="openAdmissionCamera()">
              <i class="bi bi-camera-video-fill me-1"></i> Live Camera
            </button>
            <div id="cameraStatusText" class="small text-muted"></div>
            <div id="liveCameraContainer" class="d-none mt-2 border border-2 border-primary rounded p-2 bg-light text-center">
              <video id="cameraVideo" autoplay playsinline class="w-100 rounded mb-2" style="max-height: 140px; object-fit: cover;"></video>
              <canvas id="cameraCanvas" class="d-none"></canvas>
              <div class="d-flex gap-1">
                <button type="button" class="btn btn-success btn-sm flex-grow-1 fw-bold" onclick="captureAdmissionPhoto()">Capture</button>
                <button type="button" class="btn btn-outline-danger btn-sm fw-bold" onclick="stopAdmissionCamera()">Close</button>
              </div>
            </div>
          </div>
          <div class="col-md-4">
            <label class="form-label fw-bold">Reset Password (Optional)</label>
            <input type="text" name="new_password" class="form-control border-2" placeholder="Leave blank to keep existing">
          </div>
          <div class="col-md-4">
            <label class="form-label fw-bold">Notes</label>
            <input type="text" name="notes" class="form-control border-2" value="{{ student.notes or '' }}">
          </div>
        </div>

        <div class="mt-4 d-flex justify-content-end gap-2">
          <a href="{{ url_for('admin_student_detail', student_id=student.id) }}" class="btn btn-outline-secondary fw-bold">Cancel</a>
          <button type="submit" class="btn btn-primary btn-lg fw-bold">Save Changes</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
