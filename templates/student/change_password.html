{% extends "base.html" %}
{% block title %}Change Password — {{ institute_name }}{% endblock %}

{% block content %}
<div class="container" style="max-width: 560px;">
  <div class="bold-card">
    <div class="bold-card-header">
      <i class="bi bi-key-fill me-2"></i> Change My Student Password ({{ student.student_code }})
    </div>
    <div class="card-body p-4">
      <p class="text-muted">
        Your Student ID (<strong>{{ student.student_code }}</strong>) is fixed in sequence. You can change your password anytime below.
      </p>
      <form method="POST">
        <div class="mb-3">
          <label class="form-label fw-bold">Current Password</label>
          <div class="input-group">
            <input type="password" name="current_password" id="curStuPw" class="form-control border-2" required>
            <button class="btn btn-outline-secondary" type="button" onclick="togglePasswordField('curStuPw', this)">Show</button>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label fw-bold">New Password</label>
          <div class="input-group">
            <input type="password" name="new_password" id="newStuPw" class="form-control border-2" minlength="4" required>
            <button class="btn btn-outline-secondary" type="button" onclick="togglePasswordField('newStuPw', this)">Show</button>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label fw-bold">Confirm New Password</label>
          <input type="password" name="confirm_password" class="form-control border-2" minlength="4" required>
        </div>
        <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold">Update Password</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
